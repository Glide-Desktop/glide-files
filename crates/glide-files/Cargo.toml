[package]
name = "glide-files"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "glide_files"
path = "src/lib.rs"

[[bin]]
name = "glide-files"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
iced = { version = "0.14.0", default-features = false, features = [
    "wgpu",
    "tiny-skia",
    "crisp",
    "wayland",
    "tokio",
    "svg",
    "image",
    "web-colors",
    "advanced",
] }
glide-config.workspace = true
glide-sdk.workspace = true
glide-app.workspace = true
serde.workspace = true
toml.workspace = true
libc = "0.2"
zbus.workspace = true
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }
resvg = { version = "0.48.1", default-features = false }
wayland-backend = { version = "0.3", features = ["client_system", "dlopen"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "unstable"] }

[dev-dependencies]
glide-theme.workspace = true
wayland-server = "0.31"
